<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}{% if page.collection == "conseils" %} | Pignada{% endif %}</title>
<meta name="description" content="{{ page.description | escape }}">
<meta name="theme-color" content="#0B6A87">
{%- if page.url == "/" %}
<meta name="google-site-verification" content="PC2tTG0HtRGmaxH7LLaqD865HZM3SFTVzZXauoK-Jk8">
{%- endif %}
{%- if page.noindex %}
<meta name="robots" content="noindex">
{%- else %}
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
{%- endif %}
<meta property="og:type" content="{% if page.collection == 'conseils' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | escape }}{% if page.collection == "conseils" %} | Pignada{% endif %}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:site_name" content="Pignada">
<meta property="og:locale" content="fr_FR">
<meta property="og:image" content="{{ site.url }}/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/assets/fonts/schibsted-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/schibsted-grotesk-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
