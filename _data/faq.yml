questions:
- question: Combien de temps faut-il pour créer un site ?
  reponse: En général, une à trois semaines pour un site vitrine. Le délai dépend surtout du temps nécessaire pour réunir vos textes et vos photos. Le calendrier est fixé ensemble dans le devis.
- question: Combien coûte un site ?
  reponse: 'Chaque projet est différent : le prix dépend du nombre de pages, des textes à rédiger et des fonctions souhaitées (réservation, plusieurs langues…). Après un premier échange, vous recevez un devis détaillé, gratuit et sans engagement.'
- question: Qu'est-ce que je dois fournir ?
  reponse: Votre logo si vous en avez un, des photos de votre établissement et les informations pratiques (horaires, tarifs, adresse). Je peux vous aider à rédiger les textes et à les mettre en forme.
- question: Est-ce que je pourrai modifier mon site moi-même ?
  reponse: 'Oui, si votre site est fait sous WordPress : je vous montre comment changer un texte ou une photo. Si vous préférez ne pas y toucher, la formule de maintenance inclut ces petites modifications.'
- question: Mon site m'appartient-il vraiment ?
  reponse: Oui. Le nom de domaine est réservé à votre nom et vous recevez tous les fichiers et accès. Si vous arrêtez la maintenance, vous gardez votre site.
- question: Mon site sera-t-il bien placé sur Google ?
  reponse: 'Chaque site est construit pour être bien compris par Google : titres, descriptions, rapidité, affichage mobile. Je vous aide aussi à soigner votre fiche Google, très importante pour les recherches locales. Personne ne peut honnêtement garantir une première place, mais ces bases font une vraie différence.'
- question: Pouvez-vous traduire mon site en anglais ?
  reponse: Oui. Chaque traduction est relue et adaptée au vocabulaire des voyageurs, pour que vos visiteurs étrangers s'y retrouvent facilement.
- question: Faites-vous aussi les logos ?
  reponse: Je ne suis pas graphiste. Je travaille à partir de votre logo et de vos couleurs. Si vous n'en avez pas, je peux réaliser une mise en forme simple de votre nom ou vous orienter vers un graphiste.
- question: Comment se passe le paiement ?
  reponse: 'Les modalités sont précisées dans le devis : en général un acompte au lancement du projet et le solde à la mise en ligne. La maintenance se règle chaque mois et peut être arrêtée.'
